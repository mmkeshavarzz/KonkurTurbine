name: Weekly PDF Hunter 🎓 (Userbot Edition)

on:
  schedule:
    - cron: '29 20 * * 5'
  workflow_dispatch:

# ⚠️ این خط واجبه تا ربات بتونه فایل لیست اسپانسرها رو سیو کنه تو ریپازیتوری
permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v3

      - name: Set up Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies 📦
        run: |
          pip install telethon requests

      - name: Run Scraper 👾
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python scraper.py

      - name: Save Sponsor Links Archive 🚀
        run: |
          git config --global user.name "Turbine-Bot[bot]"
          git config --global user.email "turbine-bot@users.noreply.github.com"
          git add channels/
          
          # اگر فایل جدیدی اضافه شده بود کامیت کن، وگرنه ارور نده و برو جلو
          if git diff --cached --quiet; then
            echo "لینک جدیدی پیدا نشد، چیزی برای سیو کردن نیست."
          else
            git commit -m "🤖 اضافه شدن دیتابیس اسپانسرهای امروز [skip ci]"
            git push
          fi
